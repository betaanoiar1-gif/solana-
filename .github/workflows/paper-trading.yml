name: Paper Trading

on:
  workflow_dispatch:
  schedule:
    # Run ~5h30m per cycle, then restart. 7-minute offset avoids the top of the hour.
    - cron: '7 0,6,12,18 * * *'

concurrency:
  group: paper-trading
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PAPER_MODE: 'true'
      PAPER_INITIAL_USD: '100'
      PAPER_RUN_MINUTES: '330'
      PAPER_STATE_FILE: data/paper-state.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RPC_ENDPOINT: https://api.mainnet-beta.solana.com
      RPC_WEBSOCKET_ENDPOINT: wss://api.mainnet-beta.solana.com
      COMMITMENT_LEVEL: confirmed
      LOG_LEVEL: info
      ONE_TOKEN_AT_A_TIME: 'true'
      PRE_LOAD_EXISTING_MARKETS: 'false'
      CACHE_NEW_MARKETS: 'false'
      TRANSACTION_EXECUTOR: default
      COMPUTE_UNIT_LIMIT: '101337'
      COMPUTE_UNIT_PRICE: '421197'
      CUSTOM_FEE: '0.006'
      QUOTE_MINT: WSOL
      QUOTE_AMOUNT: '0.001'
      AUTO_BUY_DELAY: '0'
      MAX_BUY_RETRIES: '10'
      BUY_SLIPPAGE: '20'
      AUTO_SELL: 'true'
      MAX_SELL_RETRIES: '10'
      AUTO_SELL_DELAY: '0'
      PRICE_CHECK_INTERVAL: '2000'
      PRICE_CHECK_DURATION: '600000'
      TAKE_PROFIT: '40'
      STOP_LOSS: '20'
      SELL_SLIPPAGE: '20'
      USE_SNIPE_LIST: 'false'
      SNIPE_LIST_REFRESH_INTERVAL: '30000'
      FILTER_CHECK_DURATION: '60000'
      FILTER_CHECK_INTERVAL: '2000'
      CONSECUTIVE_FILTER_MATCHES: '3'
      CHECK_IF_MUTABLE: 'false'
      CHECK_IF_SOCIALS: 'true'
      CHECK_IF_MINT_IS_RENOUNCED: 'true'
      CHECK_IF_FREEZABLE: 'false'
      CHECK_IF_BURNED: 'true'
      MIN_POOL_SIZE: '5'
      MAX_POOL_SIZE: '50'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pinned upstream in Paper Mode
        run: node runner-fixed.js

      - name: Persist paper state
        if: always()
        run: |
          mkdir -p data
          if [ -f data/paper-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paper-state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist paper trading state"
              git push
            fi
          fi
